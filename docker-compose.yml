version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/dev-server:latest
    container_name: hotel-temporal
    ports:
      - '7233:7233'
      - '8233:8233'
    command: ['--ip', '0.0.0.0']

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-orchestrator-app
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEMPORAL_ADDRESS=temporal:7233
      - INTERNAL_API_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
